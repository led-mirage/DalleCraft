<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DalleCraft 設定</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .setting-group {
            margin: 10px 30px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    
        .form-group {
            margin-bottom: 15px;
        }
    
        .form-group > label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        h3 {
            margin: 0.75rem;
        }

        .description {
            color: #555;
            font-size: 0.9rem;
            margin: 0.5rem 0 0;
        }

        #image-size-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
            gap: 0.35rem 1rem;
        }

        .image-size-option label {
            margin-left: 0.2rem;
        }

        .model-generation + .model-generation {
            margin-top: 0.75rem;
        }

        .model-generation-title {
            display: block;
            font-weight: bold;
            margin-bottom: 0.35rem;
        }
    </style>
</head>
<body>
<div class="root-block">
    <div class="header">
        <span id="title">設定</span>
        <nav>
            <ul>
                <li><button id="cancel-button" onclick="cancel()">cancel</button></li>
                <li><button id="submit-button" onclick="submit()">ok</button></li>
            </ul>
        </nav>
    </div>
    <div class="content-block">
        <div class="category">
            <h3 style="margin-top:0px;">API種別</h3>
            <div class="setting-group">
                <input type="radio" id="optionOpenAI" name="apiType" value="openai" checked>
                <label for="optionOpenAI">OpenAI</label>
                <input type="radio" id="optionFoundry" name="apiType" value="foundry">
                <label for="optionFoundry">Microsoft Foundry</label>
            </div>
        </div>
        <div class="category" id="openai-setting" style="display: none;">
            <h3>OpenAI用設定</h3>
            <div class="setting-group">
                <div class="form-group">
                    <label for="openaiApiKey">APIキー用環境変数:</label>
                    <input type="text" id="openaiApiKey" placeholder="APIキーを格納する環境変数名を入力">
                </div>
            </div>
        </div>

        <div class="category" id="foundry-setting" style="display: none;">
            <h3>Microsoft Foundry用設定</h3>
            <div class="setting-group">
                <div class="form-group">
                    <label for="foundryApiKey">APIキー用環境変数:</label>
                    <input type="text" id="foundryApiKey" placeholder="APIキーを格納する環境変数名を入力">
                </div>
                <div class="form-group">
                    <label for="foundryEndpoint">OpenAI v1エンドポイント用環境変数:</label>
                    <input type="text" id="foundryEndpoint" placeholder="エンドポイントを格納する環境変数名を入力">
                </div>
                <div class="form-group">
                    <label for="foundry26FlareDeployment">GPT Image 2.6 Flareのデプロイ名:</label>
                    <input type="text" id="foundry26FlareDeployment" placeholder="未使用の場合は空欄">
                </div>
                <div class="form-group">
                    <label for="foundry26SunburstDeployment">GPT Image 2.6 Sunburstのデプロイ名:</label>
                    <input type="text" id="foundry26SunburstDeployment" placeholder="未使用の場合は空欄">
                </div>
                <div class="form-group">
                    <label for="foundry25FlareDeployment">GPT Image 2.5 Flareのデプロイ名:</label>
                    <input type="text" id="foundry25FlareDeployment" placeholder="未使用の場合は空欄">
                </div>
                <div class="form-group">
                    <label for="foundry25SunburstDeployment">GPT Image 2.5 Sunburstのデプロイ名:</label>
                    <input type="text" id="foundry25SunburstDeployment" placeholder="未使用の場合は空欄">
                </div>
                <p class="description">使用するモデルのデプロイ名だけ入力してください。エンドポイントにはFoundryのデプロイ画面に表示されるOpenAI v1推論エンドポイントを使用してください。</p>
            </div>
        </div>
        <div class="category">
            <h3>モデル</h3>
            <div class="setting-group">
                <div class="model-generation">
                    <span class="model-generation-title">GPT Image 2.6（推奨）</span>
                    <input type="radio" id="option26Flare" name="modelId" value="gpt-image-2.6-flare" checked>
                    <label for="option26Flare">Flare（高速）</label>
                    <input type="radio" id="option26Sunburst" name="modelId" value="gpt-image-2.6-sunburst">
                    <label for="option26Sunburst">Sunburst（高精度）</label>
                </div>
                <div class="model-generation">
                    <span class="model-generation-title">GPT Image 2.5（互換）</span>
                    <input type="radio" id="option25Flare" name="modelId" value="gpt-image-2.5-flare">
                    <label for="option25Flare">Flare（高速）</label>
                    <input type="radio" id="option25Sunburst" name="modelId" value="gpt-image-2.5-sunburst">
                    <label for="option25Sunburst">Sunburst（高精度）</label>
                </div>
            </div>
        </div>
        <div class="category">
            <h3>画像サイズ</h3>
            <div class="setting-group" id="image-size-options"></div>
        </div>
        <div class="category">
            <h3>画質</h3>
            <div class="setting-group">
                <input type="radio" id="optionQualityAuto" name="imageQuality" value="auto" checked>
                <label for="optionQualityAuto">自動</label>
                <input type="radio" id="optionQualityLow" name="imageQuality" value="low">
                <label for="optionQualityLow">低</label>
                <input type="radio" id="optionQualityMedium" name="imageQuality" value="medium">
                <label for="optionQualityMedium">中</label>
                <input type="radio" id="optionQualityHigh" name="imageQuality" value="high">
                <label for="optionQualityHigh">高</label>
                <input type="radio" id="optionQualityXHigh" name="imageQuality" value="xhigh">
                <label for="optionQualityXHigh">最高</label>
                <input type="radio" id="optionQualityMax" name="imageQuality" value="max">
                <label for="optionQualityMax">最大</label>
            </div>
        </div>
        <div class="category" id="complexity-setting">
            <h3>生成前の計画量</h3>
            <div class="setting-group">
                <input type="radio" id="optionComplexityLow" name="imageComplexity" value="low">
                <label for="optionComplexityLow">低</label>
                <input type="radio" id="optionComplexityMedium" name="imageComplexity" value="medium">
                <label for="optionComplexityMedium">中</label>
                <input type="radio" id="optionComplexityHigh" name="imageComplexity" value="high" checked>
                <label for="optionComplexityHigh">高</label>
                <p class="description">画像を描画する前に、構図・文字・要素間の関係を検討する処理量です。画質とは別の設定です。</p>
            </div>
        </div>
    </div>
    <div style="height: 1em;"></div>
    <footer><span id="copyright">Copyright</span></footer>
</div>
<script src="js/image-size.js"></script>
<script>
window.addEventListener("DOMContentLoaded", function() {
    const apiTypeRadioButtons = document.querySelectorAll('input[name="apiType"]');
    apiTypeRadioButtons.forEach(radio => {
        radio.addEventListener('change', function(event) {
            if (event.target.checked) {
                showApiSettings(event.target.value);
            }
        });
    });

    const modelRadioButtons = document.querySelectorAll('input[name="modelId"]');
    modelRadioButtons.forEach(radio => {
        radio.addEventListener("change", function(event) {
            if (event.target.checked) {
                showComplexitySettings(event.target.value);
            }
        });
    });
});

function showApiSettings(apiType) {
    document.getElementById("openai-setting").style.display = apiType === "openai" ? "block" : "none";
    document.getElementById("foundry-setting").style.display = apiType === "foundry" ? "block" : "none";
}

function showComplexitySettings(modelId) {
    document.getElementById("complexity-setting").style.display =
        modelId.startsWith("gpt-image-2.6-") ? "block" : "none";
}

function setRadioValue(name, value, fallback) {
    const radio = document.querySelector(`input[name="${name}"][value="${value}"]`)
        || document.querySelector(`input[name="${name}"][value="${fallback}"]`);
    if (radio) {
        radio.checked = true;
    }
}

// pywebview初期化
window.addEventListener("pywebviewready", async function() {
    await initComponents();
});

// コンポーネント初期化
async function initComponents() {
    const info = await pywebview.api.api_get_app_info();
    const footer = document.getElementById("copyright");
    if (footer) {
        footer.textContent = info.copyright;
    }

    const config = await pywebview.api.api_get_config();
    setRadioValue("apiType", config.api_type, "openai");
    showApiSettings(config.api_type);
    document.getElementById("openaiApiKey").value = config.openai.api_key_envvar;
    document.getElementById("foundryApiKey").value = config.foundry.api_key_envvar;
    document.getElementById("foundryEndpoint").value = config.foundry.endpoint_envvar;
    const deployments = config.foundry.deployments || {};
    document.getElementById("foundry26FlareDeployment").value = deployments["gpt-image-2.6-flare"] || "";
    document.getElementById("foundry26SunburstDeployment").value = deployments["gpt-image-2.6-sunburst"] || "";
    document.getElementById("foundry25FlareDeployment").value = deployments["gpt-image-2.5-flare"] || "";
    document.getElementById("foundry25SunburstDeployment").value = deployments["gpt-image-2.5-sunburst"] || "";

    setRadioValue("modelId", config.model.id, "gpt-image-2.6-flare");
    showComplexitySettings(config.model.id);
    populateImageSizeRadios(
        document.getElementById("image-size-options"),
        config.model.size_presets,
        config.model.size
    );
    setRadioValue("imageQuality", config.model.quality, "auto");
    setRadioValue("imageComplexity", config.model.complexity, "high");
}

// キャンセルボタン押下イベント
function cancel() {
    pywebview.api.api_cancel_config();
}

// OKボタン押下イベント
async function submit() {
    const apiType = document.querySelector('input[name="apiType"]:checked').value;
    const modelId = document.querySelector('input[name="modelId"]:checked').value;
    const config = {
        apiType: apiType,
        openai: {
            api_key_envvar: document.getElementById("openaiApiKey").value.trim()
        },
        foundry: {
            api_key_envvar: document.getElementById("foundryApiKey").value.trim(),
            endpoint_envvar: document.getElementById("foundryEndpoint").value.trim(),
            deployments: {
                "gpt-image-2.6-flare": document.getElementById("foundry26FlareDeployment").value.trim(),
                "gpt-image-2.6-sunburst": document.getElementById("foundry26SunburstDeployment").value.trim(),
                "gpt-image-2.5-flare": document.getElementById("foundry25FlareDeployment").value.trim(),
                "gpt-image-2.5-sunburst": document.getElementById("foundry25SunburstDeployment").value.trim()
            }
        },
        model: {
            id: modelId,
            size: document.querySelector('input[name="imageSize"]:checked').value,
            quality: document.querySelector('input[name="imageQuality"]:checked').value,
            complexity: document.querySelector('input[name="imageComplexity"]:checked').value
        }
    };
    if (apiType === "foundry" && !config.foundry.deployments[modelId]) {
        alert(`${modelId}のFoundryデプロイ名を入力してください。`);
        return;
    }
    try {
        await pywebview.api.api_submit_config(config);
    } catch (error) {
        alert(error.message || String(error));
    }
}
</script>
</body>
</html>
