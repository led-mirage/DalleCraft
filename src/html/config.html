<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DalleCraft 設定</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .setting-group {
            margin: 10px 30px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    
        .form-group {
            margin-bottom: 15px;
        }
    
        .form-group > label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
    
        input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        h3 {
            margin: 0.75rem;
        }

        .description {
            color: #555;
            font-size: 0.9rem;
            margin: 0.5rem 0 0;
        }

        #image-size-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
            gap: 0.35rem 1rem;
        }

        .image-size-option label {
            margin-left: 0.2rem;
        }
    </style>
</head>
<body>
<div class="root-block">
    <div class="header">
        <span id="title">設定</span>
        <nav>
            <ul>
                <li><button id="cancel-button" onclick="cancel()">cancel</button></li>
                <li><button id="submit-button" onclick="submit()">ok</button></li>
            </ul>
        </nav>
    </div>
    <div class="content-block">
        <div class="category">
            <h3 style="margin-top:0px;">API種別</h3>
            <div class="setting-group">
                <input type="radio" id="optionOpenAI" name="apiType" value="openai" checked>
                <label for="optionOpenAI">OpenAI</label>
                <input type="radio" id="optionFoundry" name="apiType" value="foundry">
                <label for="optionFoundry">Microsoft Foundry</label>
            </div>
        </div>
        <div class="category" id="openai-setting" style="display: none;">
            <h3>OpenAI用設定</h3>
            <div class="setting-group">
                <div class="form-group">
                    <label for="openaiApiKey">APIキー用環境変数:</label>
                    <input type="text" id="openaiApiKey" placeholder="APIキーを格納する環境変数名を入力">
                </div>
            </div>
        </div>

        <div class="category" id="foundry-setting" style="display: none;">
            <h3>Microsoft Foundry用設定</h3>
            <div class="setting-group">
                <div class="form-group">
                    <label for="foundryApiKey">APIキー用環境変数:</label>
                    <input type="text" id="foundryApiKey" placeholder="APIキーを格納する環境変数名を入力">
                </div>
                <div class="form-group">
                    <label for="foundryEndpoint">OpenAI v1エンドポイント用環境変数:</label>
                    <input type="text" id="foundryEndpoint" placeholder="エンドポイントを格納する環境変数名を入力">
                </div>
                <div class="form-group">
                    <label for="foundryFlareDeployment">Flareのデプロイ名:</label>
                    <input type="text" id="foundryFlareDeployment" placeholder="gpt-image-2.5-flare">
                </div>
                <div class="form-group">
                    <label for="foundrySunburstDeployment">Sunburstのデプロイ名:</label>
                    <input type="text" id="foundrySunburstDeployment" placeholder="gpt-image-2.5-sunburst">
                </div>
                <p class="description">エンドポイントにはFoundryのデプロイ画面に表示されるOpenAI v1推論エンドポイントを使用してください。</p>
            </div>
        </div>
        <div class="category">
            <h3>モデル</h3>
            <div class="setting-group">
                <input type="radio" id="optionFlare" name="modelVariant" value="flare" checked>
                <label for="optionFlare">GPT Image 2.5 Flare（高速）</label>
                <input type="radio" id="optionSunburst" name="modelVariant" value="sunburst">
                <label for="optionSunburst">GPT Image 2.5 Sunburst（高精度）</label>
            </div>
        </div>
        <div class="category">
            <h3>画像サイズ</h3>
            <div class="setting-group" id="image-size-options"></div>
        </div>
        <div class="category">
            <h3>画質</h3>
            <div class="setting-group">
                <input type="radio" id="optionQualityAuto" name="imageQuality" value="auto" checked>
                <label for="optionQualityAuto">自動</label>
                <input type="radio" id="optionQualityLow" name="imageQuality" value="low">
                <label for="optionQualityLow">低</label>
                <input type="radio" id="optionQualityMedium" name="imageQuality" value="medium">
                <label for="optionQualityMedium">中</label>
                <input type="radio" id="optionQualityHigh" name="imageQuality" value="high">
                <label for="optionQualityHigh">高</label>
                <input type="radio" id="optionQualityXHigh" name="imageQuality" value="xhigh">
                <label for="optionQualityXHigh">最高</label>
                <input type="radio" id="optionQualityMax" name="imageQuality" value="max">
                <label for="optionQualityMax">最大</label>
            </div>
        </div>
    </div>
    <div style="height: 1em;"></div>
    <footer><span id="copyright">Copyright</span></footer>
</div>
<script src="js/image-size.js"></script>
<script>
window.addEventListener("DOMContentLoaded", function() {
    const apiTypeRadioButtons = document.querySelectorAll('input[name="apiType"]');
    apiTypeRadioButtons.forEach(radio => {
        radio.addEventListener('change', function(event) {
            if (event.target.checked) {
                showApiSettings(event.target.value);
            }
        });
    });
});

function showApiSettings(apiType) {
    document.getElementById("openai-setting").style.display = apiType === "openai" ? "block" : "none";
    document.getElementById("foundry-setting").style.display = apiType === "foundry" ? "block" : "none";
}

function setRadioValue(name, value, fallback) {
    const radio = document.querySelector(`input[name="${name}"][value="${value}"]`)
        || document.querySelector(`input[name="${name}"][value="${fallback}"]`);
    if (radio) {
        radio.checked = true;
    }
}

// pywebview初期化
window.addEventListener("pywebviewready", async function() {
    await initComponents();
});

// コンポーネント初期化
async function initComponents() {
    const info = await pywebview.api.api_get_app_info();
    const footer = document.getElementById("copyright");
    if (footer) {
        footer.textContent = info.copyright;
    }

    const config = await pywebview.api.api_get_config();
    setRadioValue("apiType", config.api_type, "openai");
    showApiSettings(config.api_type);
    document.getElementById("openaiApiKey").value = config.openai.api_key_envvar;
    document.getElementById("foundryApiKey").value = config.foundry.api_key_envvar;
    document.getElementById("foundryEndpoint").value = config.foundry.endpoint_envvar;
    document.getElementById("foundryFlareDeployment").value = config.foundry.flare_deployment;
    document.getElementById("foundrySunburstDeployment").value = config.foundry.sunburst_deployment;

    setRadioValue("modelVariant", config.model.variant, "flare");
    populateImageSizeRadios(
        document.getElementById("image-size-options"),
        config.model.size_presets,
        config.model.size
    );
    setRadioValue("imageQuality", config.model.quality, "auto");
}

// キャンセルボタン押下イベント
function cancel() {
    pywebview.api.api_cancel_config();
}

// OKボタン押下イベント
async function submit() {
    const apiType = document.querySelector('input[name="apiType"]:checked').value;
    const config = {
        apiType: apiType,
        openai: {
            api_key_envvar: document.getElementById("openaiApiKey").value.trim()
        },
        foundry: {
            api_key_envvar: document.getElementById("foundryApiKey").value.trim(),
            endpoint_envvar: document.getElementById("foundryEndpoint").value.trim(),
            flare_deployment: document.getElementById("foundryFlareDeployment").value.trim(),
            sunburst_deployment: document.getElementById("foundrySunburstDeployment").value.trim()
        },
        model: {
            variant: document.querySelector('input[name="modelVariant"]:checked').value,
            size: document.querySelector('input[name="imageSize"]:checked').value,
            quality: document.querySelector('input[name="imageQuality"]:checked').value
        }
    };
    await pywebview.api.api_submit_config(config);
}
</script>
</body>
</html>
