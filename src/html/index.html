<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>DalleCraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="root-block">
    <div class="header">
        <span id="session-name" ondblclick="openSessionNameDialog()" style="user-select: none;">DalleCraft</span>
        <nav>
            <ul>
                <li><button id="prev-button" onclick="prevSession()" class="tooltip">
                    <i class="fa-solid fa-backward-step"></i><span class="tooltiptext">前のセッション</span></button>
                </li>
                <li><button id="next-button" onclick="nextSession()" class="tooltip">
                    <i class="fa-solid fa-forward-step"></i><span class="tooltiptext">次のセッション</span></button>
                </li>
                <li><button id="new-button" onclick="newSession()" class="tooltip" style="width: 4rem;">
                    <i class="fa-solid fa-plus"></i><span class="tooltiptext">新しいセッション</span></button>
                </li>
                <li style="width: 1.25rem;"></li>
                <li><button id="delete-button" onclick="deleteSession()" class="tooltip">
                    <i class="fa-regular fa-trash-can"></i><span class="tooltiptext">削除</span></button>
                </li>
                <li><button id="settings-button" onclick="config()" class="tooltip">
                    <i class="fa-solid fa-gear"></i><span class="tooltiptext">設定</span></button>
                </li>
            </ul>
        </nav>
    </div>
    <div id="dalle-session" class="content-block">
        <!-- ここにアイテムがが動的に追加される
        <div class="prompt-image-card" id="card-1">
            <div class="prompt">三毛猫</div>
            <div class="image">
                <img src="data:image/png;base64,..." />
            </div>
            <div class="actions">
                <button class="card-delete-btn"><i class='fa-regular fa-trash-can'></i></button>
            </div>
        </div>
        <div class="prompt-image-card" id="card-2">
            <div class="prompt">芝犬</div>
            <div class="image">
                <img src="data:image/png;base64,..." />
            </div>
            <div class="actions">
                <button class="card-delete-btn"><i class='fa-regular fa-trash-can'></i></button>
            </div>
        </div>
        <div class="prompt-image-card" id="card-3">
            <div class="prompt">ラーメン</div>
            <div class="error">
                エラー情報
            </div>
            <div class="actions">
                <button class="card-delete-btn"><i class='fa-regular fa-trash-can'></i></button>
            </div>
        </div>
        -->
    </div>
    <div class="prompt-panel">
        <div class="quick-settings" aria-label="画像生成のクイック設定">
            <label for="quick-image-size">解像度</label>
            <select id="quick-image-size" onchange="saveQuickSettings()">
                <option value="auto">自動</option>
                <option value="1024x1024">1024 × 1024</option>
                <option value="1536x1024">1536 × 1024（横長）</option>
                <option value="1024x1536">1024 × 1536（縦長）</option>
            </select>
            <label for="quick-image-quality">品質</label>
            <select id="quick-image-quality" onchange="saveQuickSettings()">
                <option value="auto">Auto</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="xhigh">XHigh</option>
                <option value="max">Max</option>
            </select>
        </div>
        <div class="prompt-area">
            <div id="prompt-input-container" class="prompt-input-container">
                <div id="input-image-preview" class="input-image-preview" hidden>
                    <img id="input-image-preview-img" alt="貼り付けた入力画像">
                    <button id="remove-input-image-button" type="button" aria-label="貼り付けた画像を削除">&times;</button>
                </div>
                <textarea id="prompt" placeholder="プロンプトを入力...（Ctrl+Vまたはドラッグ＆ドロップで画像を貼り付け）"></textarea>
            </div>
            <button id="submit-button" type="button" onclick="genImage()">画像生成</button>
        </div>
    </div>
    <footer><span id="copyright">Copyright</span></footer>
</div>
<!-- 進捗モーダル -->
<div id="progress-modal" class="modal-background">
    <div class="modal-content">
        <div class="loader"></div>
        <p id="progress-modal-message"></p>
    </div>
</div>
<!-- 画像表示モーダル -->
<div id="image-modal" class="modal-background">
    <span class="image-modal-close">&times;</span>
    <img class="image-modal-content" id="image-modal-img">
</div>
<!-- 画像情報モーダル -->
<div id="image-info-modal" class="modal-background">
    <div class="info-modal-content">
        <div class="info-modal-header">
            <span id="image-info-modal-close-button" class="close">&times;</span>
        </div>
        <div class="info-modal-body">
            <p class="image-info-modal-title">画像情報</p>
            <table>
                <tr><td>ファイル名</td><td><span id="image-info-filename"></span></td></tr>
                <tr><td>APIタイプ</td><td><span id="image-info-api-type"></span></td></tr>
                <tr><td>モデル名</td><td><span id="image-info-model-name"></span></td></tr>
                <tr><td>解像度</td><td><span id="image-info-size"></span></td></tr>
                <tr><td>画質</td><td><span id="image-info-quality"></span></td></tr>
                <tr><td>入力画像</td><td><span id="image-info-input-images"></span></td></tr>
                <tr><td>生成にかかった時間</td><td><span id="image-info-elapsed-time"></span></td></tr>
                <tr><td>プロンプト</td><td><div id="image-info-prompt"></div></td></tr>
                <tr><td>改訂版プロンプト</td><td><div id="image-info-revised-prompt"></div></td></tr>
            </table>
        </div>
    </div>
</div>

<script>
let pendingInputImage = null;

// DOM初期化
document.addEventListener("DOMContentLoaded", function() {
    document.addEventListener("contextmenu", handleContextMenu);

    initImageModal();
    initImageInfoModal();
    initInputImageHandlers();
});

// pywebview初期化
window.addEventListener("pywebviewready", async function() {
    await initComponents();
    addWelcome();
    pywebview.api.api_refresh_index_view();
});

// remをpxに変換
function rem2px(rem) {
    var rootFontSize = parseFloat(getComputedStyle(document.documentElement).fontSize);
    return rem * rootFontSize;
}

// 画像表示モーダル初期化
function initImageModal() {
    const modal = document.getElementById("image-modal");
    const span = document.getElementsByClassName("image-modal-close")[0];
    span.onclick = function() {
        modal.style.display = "none";
    };

    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    };

    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape" && modal.style.display === "block") {
            modal.style.display = "none";
        }
    });
}

function showImageModal(src, entryId, imageKind) {
    const modal = document.getElementById("image-modal");
    const modalImg = document.getElementById("image-modal-img");
    modalImg.src = src;
    modalImg.dataset.kind = imageKind || "output";
    if (entryId === null || entryId === undefined) {
        delete modalImg.dataset.entryId;
    }
    else {
        modalImg.dataset.entryId = entryId;
    }
    modal.style.display = "block";
}

// 画像情報モーダル初期化
function initImageInfoModal() {
    const modal = document.getElementById("image-info-modal");
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape" && modal.style.display === "block") {
            hideImageInfoModal();
        }
    });
}

// コンポーネント初期化
async function initComponents() {
    const [info, config] = await Promise.all([
        pywebview.api.api_get_app_info(),
        pywebview.api.api_get_config()
    ]);
    footer = document.getElementById("copyright");
    if (footer) {
        footer.textContent = info.copyright;
    }
    initQuickSettings(config.model);
}

// クイック設定を現在の設定値で初期化する
function initQuickSettings(modelConfig) {
    const sizeSelect = document.getElementById("quick-image-size");
    const qualitySelect = document.getElementById("quick-image-quality");
    const size = modelConfig && modelConfig.size ? modelConfig.size : "auto";
    const quality = modelConfig && modelConfig.quality ? modelConfig.quality : "auto";

    sizeSelect.value = Array.from(sizeSelect.options).some(option => option.value === size) ? size : "auto";
    qualitySelect.value = Array.from(qualitySelect.options).some(option => option.value === quality) ? quality : "auto";
}

// クイック設定で選択されている生成オプションを取得する
function getQuickSettings() {
    const options = {
        size: document.getElementById("quick-image-size").value,
        quality: document.getElementById("quick-image-quality").value
    };
    if (pendingInputImage) {
        options.input_image_id = pendingInputImage.input_image_id;
    }
    return options;
}

// クイック設定を保存する
async function saveQuickSettings() {
    const result = await pywebview.api.api_update_generation_options(getQuickSettings());
    if (!result.success) {
        alert(result.error_info);
        const config = await pywebview.api.api_get_config();
        initQuickSettings(config.model);
    }
}

// クリップボード貼り付けとドラッグ＆ドロップを初期化する
function initInputImageHandlers() {
    const prompt = document.getElementById("prompt");
    const container = document.getElementById("prompt-input-container");
    const preview = document.getElementById("input-image-preview-img");
    const removeButton = document.getElementById("remove-input-image-button");

    prompt.addEventListener("paste", handleInputImagePaste);
    container.addEventListener("dragenter", function(event) {
        if (hasDraggedFiles(event)) {
            event.preventDefault();
            container.classList.add("drag-active");
        }
    });
    container.addEventListener("dragover", function(event) {
        if (hasDraggedFiles(event)) {
            event.preventDefault();
            event.dataTransfer.dropEffect = "copy";
            container.classList.add("drag-active");
        }
    });
    container.addEventListener("dragleave", function(event) {
        if (!container.contains(event.relatedTarget)) {
            container.classList.remove("drag-active");
        }
    });
    container.addEventListener("drop", handleInputImageDrop);

    // ウィンドウへのファイルドロップでブラウザがファイルを開くのを防ぐ
    document.addEventListener("dragover", function(event) {
        if (hasDraggedFiles(event)) event.preventDefault();
    });
    document.addEventListener("drop", function(event) {
        if (hasDraggedFiles(event) && !container.contains(event.target)) {
            event.preventDefault();
            container.classList.remove("drag-active");
        }
    });

    removeButton.addEventListener("click", function(event) {
        event.stopPropagation();
        clearInputImage(true);
    });
    preview.addEventListener("click", showPendingInputImage);
}

function hasDraggedFiles(event) {
    return event.dataTransfer && Array.from(event.dataTransfer.types || []).includes("Files");
}

async function handleInputImagePaste(event) {
    const imageItem = Array.from(event.clipboardData.items || []).find(
        item => item.kind === "file" && item.type.startsWith("image/")
    );
    if (!imageItem) return;

    event.preventDefault();
    const imageFile = imageItem.getAsFile();
    if (imageFile) {
        await registerInputImage(imageFile, "clipboard");
    }
}

async function handleInputImageDrop(event) {
    const container = document.getElementById("prompt-input-container");
    container.classList.remove("drag-active");
    if (!hasDraggedFiles(event)) return;

    event.preventDefault();
    const files = Array.from(event.dataTransfer.files || []);
    const imageFiles = files.filter(isSupportedInputImageFile);
    if (files.length !== 1 || imageFiles.length !== 1) {
        alert("PNG、JPEG、WebP形式の画像を1枚だけドロップしてください。");
        return;
    }
    await registerInputImage(imageFiles[0], "drop");
}

function isSupportedInputImageFile(file) {
    const supportedTypes = ["image/png", "image/jpeg", "image/webp"];
    return supportedTypes.includes(file.type) || /\.(png|jpe?g|webp)$/i.test(file.name || "");
}

function getClipboardImageFilename(file) {
    if (file.type === "image/jpeg") return "pasted-image.jpg";
    if (file.type === "image/webp") return "pasted-image.webp";
    return "pasted-image.png";
}

function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("画像を読み込めませんでした。"));
        reader.readAsDataURL(file);
    });
}

async function registerInputImage(file, source) {
    if (!isSupportedInputImageFile(file)) {
        alert("PNG、JPEG、WebP形式の画像を貼り付けてください。");
        return;
    }
    if (file.size >= 20 * 1024 * 1024) {
        alert("貼り付け画像は20MB未満にしてください。");
        return;
    }

    try {
        const dataUrl = await readFileAsDataUrl(file);
        const result = await pywebview.api.api_register_input_image({
            filename: source === "clipboard" ? getClipboardImageFilename(file) : file.name,
            mime_type: file.type,
            source: source,
            image_base64: dataUrl
        });
        if (!result.success) {
            alert(result.error_info);
            return;
        }

        const previousImage = pendingInputImage;
        pendingInputImage = result;
        showInputImagePreview(result);
        if (result.resize_message) {
            alert(result.resize_message);
        }
        if (previousImage) {
            await pywebview.api.api_release_input_image(previousImage.input_image_id);
        }
    }
    catch (error) {
        alert(error.message || String(error));
    }
}

function showInputImagePreview(image) {
    const previewContainer = document.getElementById("input-image-preview");
    const preview = document.getElementById("input-image-preview-img");
    preview.src = "data:image/png;base64," + image.preview_base64;
    preview.title = image.resize_message
        ? image.filename + "\n" + image.resize_message
        : image.filename;
    previewContainer.hidden = false;
}

async function clearInputImage(releaseOnBackend) {
    const image = pendingInputImage;
    pendingInputImage = null;
    const previewContainer = document.getElementById("input-image-preview");
    const preview = document.getElementById("input-image-preview-img");
    previewContainer.hidden = true;
    preview.removeAttribute("src");
    preview.removeAttribute("title");
    if (releaseOnBackend && image) {
        await pywebview.api.api_release_input_image(image.input_image_id);
    }
}

async function showPendingInputImage() {
    if (!pendingInputImage) return;
    const imageBase64 = await pywebview.api.api_get_pending_input_image_base64(
        pendingInputImage.input_image_id
    );
    if (!imageBase64) return;
    showImageModal(
        "data:" + pendingInputImage.mime_type + ";base64," + imageBase64,
        null,
        "input"
    );
}

// Welcomeメッセージブロックを追加する
async function addWelcome() {
    const config = await pywebview.api.api_get_config();

    // セッションコンテナを取得
    const container = document.getElementById("dalle-session");

    // Welcomeコンテナを作成
    const welcomeConainer = document.createElement("div");
    welcomeConainer.id = "welcome"
    welcomeConainer.classList.add("welcome");
    container.appendChild(welcomeConainer);

    // Welcomeアイコンを作成
    const imgElement = document.createElement("img");
    imgElement.classList.add("welcome-chat-icon");
    imgElement.src = "img/app.png";
    welcomeConainer.appendChild(imgElement);

    // Welcomeタイトルを作成
    const welcomeTitle = document.createElement("div");
    welcomeTitle.id = "welcome-title";
    welcomeTitle.classList.add("welcome-title");
    welcomeTitle.textContent = config.system.welcome_title;
    welcomeConainer.appendChild(welcomeTitle);

    // Welcomeメッセージを作成
    const welcomeMessage = document.createElement("div");
    welcomeMessage.id = "welcome-message";
    welcomeMessage.classList.add("welcome-message");
    welcomeMessage.textContent = config.system.welcome_message;
    welcomeConainer.appendChild(welcomeMessage);
}

// コンテキストメニューイベントハンドラ
function handleContextMenu(event) {
    const target = event.target;

    if (target.tagName !== "IMG") return;
    if (target.dataset.kind === "input" || target.classList.contains("input-reference-image")) return;
    const inModal = target.parentElement.id == "image-modal";

    event.preventDefault();

    // 既に表示されているメニューがあれば消す
    const existingMenu = document.querySelector('.contextmenu');
    if (existingMenu) {
        document.body.removeChild(existingMenu);
    }

    let menuContent = "";
    menuContent += `<button id="saveas"><i class="fa-regular fa-floppy-disk"></i>　名前を付けて保存</button><br>`;
    if (!inModal) {
        menuContent += `<button id="regenerate"><i class="fa-solid fa-repeat"></i>　同じプロンプトで再作成</button><br>`;
        menuContent += `<button id="image-info"><i class="fa-solid fa-circle-info"></i>　画像情報を表示</button><br>`;
        menuContent += `<button id="delete-card"><i class="fa-regular fa-trash-can"></i>　画像を削除</button><br>`;
    }

    const menu = document.createElement("div");
    menu.className = "contextmenu";
    menu.style.visibility = "hidden";
    menu.innerHTML = menuContent;
    document.body.appendChild(menu);
    const menuWidth = menu.offsetWidth;
    const menuHeight = menu.offsetHeight;
    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;
    let xPos = event.pageX;
    let yPos = event.pageY;
    if (xPos + menuWidth > windowWidth) {
        xPos = windowWidth - menuWidth - 10;
    } 
    if (yPos + menuHeight > windowHeight) {
        yPos = windowHeight - menuHeight - 10;
    }
    menu.style.left = `${xPos}px`;
    menu.style.top = `${yPos}px`;
    menu.style.visibility = "visible";

    // 名前を付けて保存
    const saveasButton = document.getElementById("saveas");
    if (saveasButton) {
        saveasButton.addEventListener("click", function(clickEvent) {
            document.body.removeChild(menu);
            // 少しタイミングを遅らせないとメニューが消えない
            setTimeout(function() {
                saveImage(parseInt(target.dataset.entryId));
            }, 100);
        });
    }

    // 同じプロンプトで再作成
    const regenerateButton = document.getElementById("regenerate");
    if (regenerateButton) {
        regenerateButton.addEventListener("click", function(clickEvent) {
            document.body.removeChild(menu);
            // 少しタイミングを遅らせないとメニューが消えない
            setTimeout(function() {
                const promptElement = target.parentElement.previousElementSibling;
                const prompt = promptElement.dataset.prompt || promptElement.innerText;
                document.getElementById("prompt").value = prompt;
                genImage();
            }, 100);
        });
    }

    // 画像情報を表示
    const infoButton = document.getElementById("image-info");
    if (infoButton) {
        infoButton.addEventListener("click", function(clickEvent) {
            document.body.removeChild(menu);
            // 少しタイミングを遅らせないとメニューが消えない
            setTimeout(function() {
                showImageInfoModal(parseInt(target.dataset.entryId));
            }, 100);
        });
    }   

    // 画像を削除
    const deleteButton = document.getElementById("delete-card");
    if (deleteButton) {
        deleteButton.addEventListener("click", function(clickEvent) {
            document.body.removeChild(menu);
            // 少しタイミングを遅らせないとメニューが消えない
            setTimeout(function() {
                deleteCard(parseInt(target.dataset.entryId));
            }, 100);
        });
    }   

    // どこかクリックされたらコンテキストメニューを消す
    document.addEventListener("click", function() {
        if (document.body.contains(menu)) {
            document.body.removeChild(menu);
        }
    }, { once: true });
}

// GPT Imageで画像を生成する
async function genImage() {
    const prompt = document.getElementById("prompt").value.trim();
    if (prompt === "") return;

    showProgressModal("画像生成中...");

    try {
        const entry = await pywebview.api.api_gen_image(prompt, getQuickSettings());
        if (entry.id === undefined) {
            alert(entry.error_info || "画像を生成できませんでした。");
            return;
        }

        addCard(entry.id, prompt, entry.input_images || []);
        if (entry.success) {
            addImage(entry);
            if (pendingInputImage) {
                await clearInputImage(false);
            }
        }
        else {
            addErrorInfo(entry.error_info);
        }
        scrollToBottom();
    }
    finally {
        hideProgressModal();
    }
}

// カードを追加する
function addCard(id, prompt, inputImages = []) {
    // コンテナを取得
    const container = document.getElementById("dalle-session");

    // Welcomeメッセージが表示されていれば削除
    const welcome = document.getElementById("welcome");
    if (welcome) {
        welcome.remove();
    }

    // 新しいカードを作成
    const card = document.createElement("div");
    card.classList.add("prompt-image-card");
    card.id = `card-${id}`;

    // プロンプトを表示する要素を作成
    const promptElm = document.createElement("div");
    promptElm.classList.add("prompt");
    promptElm.dataset.prompt = prompt;

    if (inputImages.length > 0) {
        const inputImage = inputImages[0];
        const reference = document.createElement("div");
        reference.className = "input-reference";
        reference.title = inputImage.original_name || "入力画像";

        const badge = document.createElement("span");
        badge.className = "input-reference-badge";
        badge.textContent = "入力";

        const image = document.createElement("img");
        image.className = "input-reference-image";
        image.dataset.kind = "input";
        image.dataset.entryId = id;
        image.dataset.imageIndex = "0";
        if (inputImage.thumbnail_base64) {
            image.src = "data:image/png;base64," + inputImage.thumbnail_base64;
        }
        image.addEventListener("click", async function() {
            const imageBase64 = await pywebview.api.api_get_input_image_base64(
                parseInt(this.dataset.entryId),
                parseInt(this.dataset.imageIndex)
            );
            if (imageBase64) {
                showImageModal(
                    "data:" + (inputImage.mime_type || "image/png") + ";base64," + imageBase64,
                    parseInt(this.dataset.entryId),
                    "input"
                );
            }
        });
        reference.appendChild(image);
        reference.appendChild(badge);
        promptElm.appendChild(reference);
    }

    const promptText = document.createElement("div");
    promptText.className = "prompt-text";
    promptText.innerHTML = escapeHtml(prompt);
    promptElm.appendChild(promptText);

    // カードにプロンプト要素を追加
    card.appendChild(promptElm);

    // コンテナにカードを追加
    container.appendChild(card);
}

// 最後のカードに画像を追加する
function addImage(entry) {
    // 最後のカードを取得
    const lastCard = document.querySelector(".prompt-image-card:last-child");

    // 新しい画像領域を作成
    const imageDiv = document.createElement("div");
    imageDiv.className = "image";

    // 画像要素を作成
    const img = document.createElement('img');
    img.src = "data:image/png;base64," + entry.image_base64;
    img.dataset.entryId = entry.id;
    img.dataset.kind = "output";
    img.addEventListener("click", async function() {
        const imageBase64 = await pywebview.api.api_get_image_base64(parseInt(this.dataset.entryId));
        showImageModal(
            "data:image/png;base64," + imageBase64,
            parseInt(this.dataset.entryId),
            "output"
        );
    });
    // 画像領域に画像を追加
    imageDiv.appendChild(img);

    // カードに画像領域を追加
    lastCard.appendChild(imageDiv);
}

// 最後のエラー情報を追加する
function addErrorInfo(errorInfo) {
    // 最後のカードを取得
    const lastCard = document.querySelector(".prompt-image-card:last-child");

    // 新しいエラー領域を作成
    const errorDiv = document.createElement('div');
    errorDiv.className = 'error';
    errorDiv.textContent = errorInfo + "　";

    // 削除ボタンを追加
    const deleteButton = document.createElement('button');
    deleteButton.className = 'card-delete-btn';
    deleteButton.innerHTML = '<i class="fa-regular fa-trash-can"></i>';
    deleteButton.addEventListener("click", async function() {
        deleteCard(parseInt(lastCard.id.split("-")[1]));
    });
    errorDiv.appendChild(deleteButton);

    // カードにエラー領域を追加
    lastCard.appendChild(errorDiv);
}

// セッションを削除する
async function deleteSession() {
    if (!confirm("このセッションを削除してもいいですか？（セッション内のすべての画像が削除されます）")) return;

    await pywebview.api.api_delete_current_session();
    addWelcome();
}

// カード削除ボタン イベントハンドラ
async function deleteCard(cardId) {
    if (!confirm("削除してもいいですか？")) return;

    await pywebview.api.api_delete_entry(cardId);
    const card = document.getElementById(`card-${cardId}`);
    card.remove();
}

// 名前を付けて画像を保存する
async function saveImage(cardId) {
    await pywebview.api.api_save_image(cardId);
}

// 前のセッションを表示する
function prevSession() {
    pywebview.api.api_prev_session();
}

// 次のセッションを表示する
function nextSession() {
    pywebview.api.api_next_session();
}

// 新しいセッションを開始する
async function newSession() {
    await pywebview.api.api_new_session();
    addWelcome();
}

// 設定画面を開く
function config() {
    pywebview.api.api_open_config();
}

// 下端までスクロールする
function scrollToBottom() {
    // 画像が読み込まれるのを待つために少し遅らせる
    setTimeout(() => {
        const container = document.getElementById("dalle-session");
        container.scrollTop = container.scrollHeight;
    }, 100);
}

// 文字列をHTML用にエスケープする
function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#x27;")
        .replace(/\n/g, "<br>")
        .replace(/\t/g, "&nbsp;&nbsp;&nbsp;&nbsp;");
}

// 処理中モーダルを表示する
function showProgressModal(message) {
    const modal = document.getElementById("progress-modal");
    const messageEl = document.getElementById("progress-modal-message");
    messageEl.textContent = message;
    modal.style.display = "block";
}

// 処理中モーダルを非表示にする
function hideProgressModal() {
    const modal = document.getElementById("progress-modal");
    modal.style.display = "none";
}

// 画像情報モーダルを表示する
async function showImageInfoModal(cardId) {
    info = await pywebview.api.api_get_image_info(cardId);

    const modal = document.getElementById("image-info-modal");
    const closeButton = document.getElementById("image-info-modal-close-button");

    if (modal && closeButton) {
        const filename = document.getElementById("image-info-filename");
        filename.textContent = info.image_filename;
        const apiType = document.getElementById("image-info-api-type");
        apiType.textContent = info.api_type;
        const imageGenerationModel = document.getElementById("image-info-model-name");
        imageGenerationModel.textContent = info.model_name;
        const imageSize = document.getElementById("image-info-size");
        imageSize.textContent = info.image_size;
        const imageQuality = document.getElementById("image-info-quality");
        imageQuality.textContent = info.image_quality;
        const inputImages = document.getElementById("image-info-input-images");
        inputImages.textContent = info.input_images.length > 0
            ? info.input_images.map(image => image.original_name).join(", ")
            : "なし";
        const imageElapsedTime = document.getElementById("image-info-elapsed-time");
        imageElapsedTime.textContent = info.elapsed_time.toFixed(2) + "秒";
        const prompt = document.getElementById("image-info-prompt");
        prompt.textContent = info.prompt;
        const revisedPrompt = document.getElementById("image-info-revised-prompt");
        revisedPrompt.textContent = info.revised_prompt;

        closeButton.addEventListener("click", hideImageInfoModal, { once: true });
        modal.style.display = "block";
    }
}

// 画像情報モーダルを非表示にする
function hideImageInfoModal() {
    const modal = document.getElementById("image-info-modal");
    if (modal) {
        modal.style.display = "none";
    }
}

// セッション名変更ダイアログを開く
function openSessionNameDialog() {
    const sessionName = document.getElementById("session-name");
    const newName = prompt("セッション名を入力してください", sessionName.textContent);
    if (newName) {
        setSessionName(newName);
        pywebview.api.api_set_session_name(newName);
    }
}

//-----------------------------------------------------------------------------
// Pythonから呼び出される関数
//-----------------------------------------------------------------------------

// セッションビューをクリアする
function clearContents() {
    const container = document.getElementById("dalle-session");
    container.innerHTML = "";
}

// セッション名を設定する
function setSessionName(name) {
    const sessionName = document.getElementById("session-name");
    if (sessionName) {
        sessionName.textContent = name;
    }
}

// セッションビューにエントリー（カード）を追加する
function addEntry(entry) {
    addCard(entry.id, entry.prompt, entry.input_images || []);
    if (entry.success) {
        addImage(entry);
    }
    else {
        addErrorInfo(entry.error_info);
    }
    scrollToBottom();
}

</script>
